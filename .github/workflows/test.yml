name: checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pi: ["0.78.0", "0.87.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y neovim
      - run: npm ci
      - name: Test against the selected Pi version
        run: npm install --no-save --ignore-scripts @earendil-works/pi-coding-agent@${{ matrix.pi }} @earendil-works/pi-tui@${{ matrix.pi }}
      - run: npm run check
      - run: npm run test:nvim
      - run: npm run pack:check
  # Loads the packed tarball with real peers and with Pi-style virtual peers.
  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:smoke
